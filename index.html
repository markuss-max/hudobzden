<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFDF9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Лапка &amp; Пончик — Парный трекер калорий и веса</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/styles/tokens.css" />
  <link rel="stylesheet" href="./src/styles/base.css" />
  <link rel="stylesheet" href="./src/styles/components.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <!-- Toast & Reaction notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Main dynamic content -->
    <main id="main-content" class="main-content">
      <div class="card" style="text-align:center; padding:24px;">
        <div style="font-size:32px;">🐾</div>
        <div style="font-weight:800; margin-top:8px;">Загружаем уютный домик...</div>
      </div>
    </main>

    <!-- Bottom navigation (hidden on auth screen) -->
    <nav id="bottom-nav" class="bottom-nav hidden" aria-label="Основная навигация">
      <button class="nav-item active" data-tab="today" type="button">
        <span class="nav-icon">🏡</span>
        <span class="nav-label">Сегодня</span>
      </button>
      <button class="nav-item" data-tab="kitchen" type="button">
        <span class="nav-icon">🍲</span>
        <span class="nav-label">Общая кухня</span>
      </button>
      <button class="nav-item" data-tab="progress" type="button">
        <span class="nav-icon">📈</span>
        <span class="nav-label">Прогресс</span>
      </button>
      <button class="nav-item" data-tab="profile" type="button">
        <span class="nav-icon">🧸</span>
        <span class="nav-label">Профиль</span>
      </button>
    </nav>

    <!-- Modal container -->
    <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Optional CDN libraries (graceful fallback if offline) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- App modules (compatible with both file:// and GitHub Pages / Vercel) -->
  <script defer src="./src/config.js"></script>
  <script defer src="./src/utils/calories.js"></script>
  <script defer src="./src/utils/foodPresets.js"></script>
  <script defer src="./src/utils/confetti.js"></script>
  <script defer src="./src/utils/toast.js"></script>
  <script defer src="./src/services/supabaseClient.js"></script>
  <script defer src="./src/services/dataService.js"></script>
  <script defer src="./src/components/AuthView.js"></script>
  <script defer src="./src/components/TodayView.js"></script>
  <script defer src="./src/components/KitchenView.js"></script>
  <script defer src="./src/components/ProgressView.js"></script>
  <script defer src="./src/components/ProfileView.js"></script>
  <script defer src="./src/main.js"></script>
</body>
</html>
